name: Build macOS DMGs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag (blank uses the latest native-* release)
        required: false
        type: string
      upload_to_release:
        description: Upload the DMG to a GitHub Release
        required: true
        default: true
        type: boolean
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'packages/happy-app/src-tauri/**'

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'native-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            arch: Apple-Silicon
            runner_arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            arch: Intel
            runner_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Resolve build source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          UPLOAD_TO_RELEASE: ${{ inputs.upload_to_release }}
        run: |
          set -euo pipefail
          source_ref="$GITHUB_SHA"
          release_tag=''

          if [[ "$EVENT_NAME" == "release" ]]; then
            source_ref="$RELEASE_EVENT_TAG"
            release_tag="$RELEASE_EVENT_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_TAG" ]]; then
            source_ref="$REQUESTED_TAG"
            release_tag="$REQUESTED_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$UPLOAD_TO_RELEASE" == "true" ]]; then
            release_tag=$(gh release list --limit 100 --json tagName,publishedAt,isDraft --jq \
              'map(select((.isDraft | not) and (.tagName | startswith("native-")))) | sort_by(.publishedAt) | reverse | .[0].tagName')
            source_ref="$release_tag"
          fi

          if [[ -n "$release_tag" ]]; then
            gh release view "$release_tag" >/dev/null
          fi
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Build ad-hoc signed DMG
        working-directory: packages/happy-app
        env:
          APP_ENV: production
          APPLE_SIGNING_IDENTITY: '-'
          BUILD_TARGET: ${{ matrix.target }}
        run: pnpm exec tauri build --target "$BUILD_TARGET" --bundles dmg

      - name: Stage installer
        id: installer
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(packages/happy-app/src-tauri/target/"$BUILD_TARGET"/release/bundle/dmg/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 ]]; then
            echo "Expected exactly one DMG, found ${#dmg_files[@]}" >&2
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" ]]; then
            build_label="$RELEASE_TAG"
          else
            build_label="run-$RUN_NUMBER"
          fi
          safe_label=$(printf '%s' "$build_label" | tr -cs 'A-Za-z0-9._-' '-')

          mkdir -p artifacts
          installer="artifacts/Happy-${safe_label}-macOS-${BUILD_ARCH}.dmg"
          cp "${dmg_files[0]}" "$installer"
          installer_name=$(basename "$installer")
          (cd artifacts && shasum -a 256 "$installer_name" > "${installer_name}.sha256")
          echo "path=$installer" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Happy-macOS-${{ matrix.arch }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer to GitHub Release
        if: steps.source.outputs.release_tag != '' && (github.event_name == 'release' || inputs.upload_to_release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: gh release upload "$RELEASE_TAG" "$INSTALLER_PATH" "${INSTALLER_PATH}.sha256" --clobber
